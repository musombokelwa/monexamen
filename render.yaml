services:
  # Backend API Service
  - type: web
    name: monexamen-backend
    runtime: python
    pythonVersion: "3.11"
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT app:app
    autoDeploy: true
    region: oregon
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: monexamen-pg
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://monexamen-frontend.onrender.com
  
  # Frontend Service (Static Site)
  - type: web
    name: monexamen-frontend
    runtime: static
    rootDir: .
    buildCommand: bash build.sh
    staticPublishPath: Frontend
    autoDeploy: true
    region: oregon
    envVars:
      - key: BACKEND_URL
        value: https://monexamen-backend.onrender.com

databases:
  - name: monexamen-pg
    plan: free
    region: oregon
    postgresMajorVersion: 16
