services:
  # Database Service (Render PostgreSQL)
  - type: pserv
    name: monexamen-db
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: monexamen-pg
          property: connectionString

  # Backend API Service
  - type: web
    name: monexamen-backend
    runtime: python
    pythonVersion: "3.11"
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT app:app
    autoDeploy: true
    region: oregon
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: monexamen-pg
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
  
  # Frontend Service (Static Site)
  - type: web
    name: monexamen-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: echo "Static frontend"
    staticPublishPath: .
    autoDeploy: true
    region: oregon
    envVars: []

databases:
  - name: monexamen-pg
    plan: free
    region: oregon
    postgresMajorVersion: 16
