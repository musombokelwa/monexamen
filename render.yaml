services:
  - type: web
    name: monexamen-backend
    runtime: python
    pythonVersion: 3.14
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:5000 app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DB_HOST
        scope: pr
        value: localhost
  
  - type: web
    name: monexamen-frontend
    runtime: node
    rootDir: Frontend
    buildCommand: npm install && npm run build || echo "No build needed for static files"
    startCommand: npm start || python3 -m http.server 80
    envVars: []
