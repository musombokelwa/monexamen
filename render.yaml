services:
  # Service unifié : Frontend (Nginx) + Backend (Gunicorn/Flask)
  # Le Dockerfile racine construit les deux et les lance ensemble
  - type: web
    name: monexamen
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: monexamen-pg
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: ENABLE_CORS
        value: "True"

databases:
  - name: monexamen-pg
    plan: free
    region: oregon
    postgresMajorVersion: 16
