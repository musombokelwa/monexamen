version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: monexamen_db
    restart: always
    environment:
      POSTGRES_DB: monexamen
      POSTGRES_USER: jenos
      POSTGRES_PASSWORD: Api@12345
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./Backend
    container_name: monexamen_backend
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=monexamen
      - DB_USER=jenos
      - DB_PASSWORD=Api@12345
      - SECRET_KEY=super-secret-key-pour-monexamen-jwt
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - db

  frontend:
    build:
      context: ./Frontend
    container_name: monexamen_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
